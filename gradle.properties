# BuildCraft build configuration.

group = com.mod-buildcraft
version = 10.0.0-alpha

# Which Minecraft 26.x release the :neoforge-26x target builds against.
# Accepted values: 26.1, 26.2, 26.3 (default). Override with -Pbc.mc26=26.2
bc.mc26 = 26.3

org.gradle.jvmargs = -Xmx4G
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = false
