<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1712"/>
      <stop offset="100%" stop-color="#2b2118"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a13a"/>
      <stop offset="100%" stop-color="#b5651d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a13a"/>
      <stop offset="100%" stop-color="#7fae6b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#3a2f22" stroke-width="2"/>

  <!-- gear mark -->
  <g transform="translate(130,130)">
    <g fill="url(#gear)">
      <circle r="58"/>
      <g id="teeth">
        <rect x="-10" y="-78" width="20" height="26" rx="4"/>
      </g>
      <use href="#teeth" transform="rotate(30)"/>
      <use href="#teeth" transform="rotate(60)"/>
      <use href="#teeth" transform="rotate(90)"/>
      <use href="#teeth" transform="rotate(120)"/>
      <use href="#teeth" transform="rotate(150)"/>
      <use href="#teeth" transform="rotate(180)"/>
      <use href="#teeth" transform="rotate(210)"/>
      <use href="#teeth" transform="rotate(240)"/>
      <use href="#teeth" transform="rotate(270)"/>
      <use href="#teeth" transform="rotate(300)"/>
      <use href="#teeth" transform="rotate(330)"/>
    </g>
    <circle r="30" fill="#1b1712"/>
    <circle r="30" fill="none" stroke="#e8a13a" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <text x="240" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#f2e6d3">
    BuildCraft <tspan fill="#e8a13a">10</tspan>
  </text>
  <text x="242" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9b89a">
    NeoForge port &#183; Minecraft 26.x &amp; 1.20.1
  </text>

  <rect x="242" y="190" width="720" height="3" fill="url(#accent)"/>

  <text x="242" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9c8b6f">
    An unofficial, MPL/MIT-licensed continuation of BuildCraft 8.0.x
  </text>
</svg>
