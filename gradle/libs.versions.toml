# Version catalog for the BuildCraft NeoForge port.
#
# Two live platform targets:
#   * neoforge-26x   -> Minecraft 26.1 / 26.2 / 26.3 (calver), modern NeoForge API
#   * neoforge-1201  -> Minecraft 1.20.1, NeoForge's Forge fork (net.minecraftforge.* packages)
#
# Alias segments are letter-led on purpose: version-catalog accessors are generated by
# splitting on '-', and a purely numeric segment is not a valid Kotlin identifier.

[versions]
# --- Minecraft / loader ---------------------------------------------------
# Primary target. Select with -Pbc.mc26=26.1|26.2|26.3 (default 26.3).
minecraft-mc263 = "26.3"
minecraft-mc262 = "26.2"
minecraft-mc261 = "26.1"
neoforge-mc263 = "26.3.0.7-beta"
neoforge-mc262 = "26.2.0.88"
neoforge-mc261 = "26.1.2.109"

minecraft-mc1201 = "1.20.1"
# 1.20.1 NeoForge is published as net.neoforged:forge (a direct Forge fork).
neoforge-mc1201 = "1.20.1-47.1.106"

# --- Gradle plugins -------------------------------------------------------
moddevgradle = "2.0.147"

# --- Java -----------------------------------------------------------------
# Minecraft 1.20.1 runs on Java 17; Minecraft 26.x requires Java 25 (FancyModLoader 12 refuses older JVMs).
# The shared modules target 17 so both platforms can consume them.
java-shared = "17"
java-mc1201 = "17"
java-mc26x = "25"

# --- Libraries ------------------------------------------------------------
jetbrains-annotations = "26.0.2"
junit = "5.11.4"

[libraries]
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
moddev = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
moddev-legacy = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddevgradle" }
